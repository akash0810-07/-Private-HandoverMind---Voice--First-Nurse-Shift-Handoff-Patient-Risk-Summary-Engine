name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-lint-and-test:
    name: Backend lint & Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8

      - name: Lint (flake8)
        run: flake8 app --max-line-length=110 --extend-ignore=E203,W503

      - name: Run Pytest with coverage
        env:
          FLASK_ENV: testing
        run: pytest --cov=app --cov-report=term-missing

  frontend-build-and-test:
    name: Frontend lint, build & unit checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:5000

  e2e-tests:
    name: Playwright E2E tests
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, frontend-build-and-test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Start backend
        working-directory: backend
        env:
          FLASK_ENV: development
          DATABASE_URL: sqlite:///ci_demo.db
          STT_PROVIDER: mock
          LLM_PROVIDER: mock
          CORS_ORIGINS: http://localhost:5173
          AUTO_CREATE_TABLES: "true"
          AUTO_SEED_DEMO_DATA: "true"
        run: |
          nohup python wsgi.py > /tmp/handovermind-backend.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/health > /dev/null; then
              echo "Backend is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy. Backend logs:"
          cat /tmp/handovermind-backend.log
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies and Playwright browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build frontend for preview server
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:5000
        run: npm run build

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  docker-build:
    name: Docker build (backend & frontend)
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, frontend-build-and-test]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t handovermind-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t handovermind-frontend:ci ./frontend

  security-scan:
    name: Dependency & container security scan
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4

      - name: Python dependency audit
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true

      - name: Node dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high || true

      - name: Build backend image for scan
        run: docker build -t handovermind-backend:scan ./backend

      - name: Trivy container scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: "handovermind-backend:scan"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"
