name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-lint-and-test:
    name: Backend lint & Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint
        run: flake8 app --max-line-length=110 --extend-ignore=E203,W503

      - name: Run tests with coverage
        env:
          FLASK_ENV: testing
          STT_PROVIDER: mock
          LLM_PROVIDER: mock
        run: pytest --cov=app --cov-report=term-missing

  frontend-build-and-test:
    name: Frontend lint & production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build production bundle
        env:
          VITE_API_BASE_URL: http://127.0.0.1:5000
        run: npm run build

  e2e-tests:
    name: Playwright end-to-end tests
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, frontend-build-and-test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start backend with isolated SQLite database
        working-directory: backend
        env:
          FLASK_ENV: development
          DATABASE_URL: sqlite:///ci_demo.db
          STT_PROVIDER: mock
          LLM_PROVIDER: mock
          CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
          AUTO_CREATE_TABLES: "true"
          AUTO_SEED_DEMO_DATA: "true"
        run: |
          nohup python wsgi.py > /tmp/handovermind-backend.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/health > /dev/null; then
              echo "Backend is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Backend did not become healthy. Logs follow:"
          cat /tmp/handovermind-backend.log
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:5000
        run: npm run build

      - name: Run Playwright tests
        working-directory: frontend
        env:
          CI: "true"
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  dependency-security-scan:
    name: Dependency security audit
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, frontend-build-and-test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit Node dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
