name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: handovermind-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Render and verify health
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: production
    steps:
      - name: Validate deployment configuration
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          PRODUCTION_API_BASE_URL: ${{ secrets.PRODUCTION_API_BASE_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Missing RENDER_DEPLOY_HOOK_URL secret. Add the Render deploy hook URL in Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$PRODUCTION_API_BASE_URL" ]; then
            echo "::error::Missing PRODUCTION_API_BASE_URL secret (for example, https://your-api.onrender.com)."
            exit 1
          fi
          echo "Deployment configuration is present."

      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          response="$(curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL")"
          echo "Render accepted the deployment request."
          echo "$response"

      - name: Wait for the deployed API to become healthy
        env:
          PRODUCTION_API_BASE_URL: ${{ secrets.PRODUCTION_API_BASE_URL }}
        run: |
          api_url="${PRODUCTION_API_BASE_URL%/}"
          for attempt in $(seq 1 36); do
            status="$(curl --silent --output /tmp/health.json --write-out '%{http_code}' "$api_url/health" || true)"
            if [ "$status" = "200" ]; then
              echo "API health check passed."
              cat /tmp/health.json
              exit 0
            fi
            echo "Health check attempt $attempt/36 returned HTTP $status; waiting 10 seconds."
            sleep 10
          done
          echo "::error::API health check failed after 6 minutes."
          cat /tmp/health.json 2>/dev/null || true
          exit 1
