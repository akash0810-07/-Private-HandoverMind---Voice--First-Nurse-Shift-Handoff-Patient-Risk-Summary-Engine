services:
  - type: web
    name: handovermind-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT --timeout 60 wsgi:app
    healthCheckPath: /health
    disk:
      name: handovermind-sqlite-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:////var/data/handovermind.db
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: AUTO_CREATE_TABLES
        value: "true"
      - key: AUTO_SEED_DEMO_DATA
        value: "true"
      - key: STT_PROVIDER
        value: mock
      - key: LLM_PROVIDER
        value: mock
      - key: AUDIO_STORAGE_BACKEND
        value: local
      - key: AUDIO_STORAGE_PATH
        value: /var/data/audio

  - type: web
    name: handovermind-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: handovermind-api
          property: host
