services:
  - type: web
    name: handovermind-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: handovermind-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: handovermind-web
          property: host
      - key: STT_PROVIDER
        value: mock
      - key: LLM_PROVIDER
        value: mock
      - key: AUDIO_STORAGE_BACKEND
        value: local

  - type: web
    name: handovermind-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: handovermind-api
          property: host

databases:
  - name: handovermind-db
    databaseName: handovermind
    user: handovermind